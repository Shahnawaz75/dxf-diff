name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Python 3.9 is end-of-life and no longer available on the ubuntu-latest image.
          # It is still tested on the other operating systems.
          - os: ubuntu-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,png]"
      - name: Run tests
        run: python -m pytest
      - name: Compare the example drawings
        shell: bash
        run: |
          set +e
          dxf-diff examples/tank_rev_a.dxf examples/tank_rev_b.dxf --json example.json --html example.html
          status=$?
          set -e
          test "$status" -eq 1   # 1 = differences found
          dxf-diff --textconv examples/tank_rev_a.dxf > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.17.6"
      - run: ruff check .
      - run: ruff format --check .
